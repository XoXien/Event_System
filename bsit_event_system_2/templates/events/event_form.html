{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="event-form-page">
    <h1>{{ title }}</h1>

    <div class="card event-form-card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="event-form-actions">
                <button type="submit" class="btn primary">Save Event</button>

                {% if request.user.profile.role == "ORGANIZER" %}
                    <a class="btn" href="{% url 'events:organizer_dashboard' %}">Cancel</a>
                {% else %}
                    <a class="btn" href="{% url 'events:event_list' %}">Cancel</a>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
