{% extends "base.html" %}

{% block title %}
Organizer Login
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🛡️
        </div>

        <h1>Organizer Login</h1>

        <p class="auth-subtitle">
            BSIT Event Organizer System
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'accounts:organizer_login' %}">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your organizer username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-primary"
            >
                Organizer Login
            </button>

        </form>

        <div class="auth-footer">

            <a href="{% url 'home' %}">
                ← Home
            </a>

        </div>

    </div>

</div>

{% endblock %}
